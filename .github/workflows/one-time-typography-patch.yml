name: One-time typography patch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[typography-patched]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch typography
        shell: bash
        run: |
          cat >> style.css <<'CSS'

/* Typography readability patch — preserves existing HTML/layout. */
body{font-size:1rem}
.header nav a{font-size:.68rem}
.header-phone{font-size:.68rem}
.header-cta,.button{font-size:.68rem}
.eyebrow,.label{font-size:.68rem}
.hero-copy>p{font-size:clamp(.92rem,1.15vw,1.05rem);line-height:1.7}
.service p{font-size:.9rem;line-height:1.65}
.about p,.process-header p{font-size:.95rem;line-height:1.7}
.process-step h3{font-size:.82rem}
.process-step p{font-size:.88rem;line-height:1.65}
main>h2+p{font-size:.95rem;line-height:1.7}
.form-field label{font-size:.7rem}
[data-fs-error]{font-size:.72rem}
main>.form-success,main>.form-error{font-size:.9rem}
#quoteForm button{font-size:.72rem}
.form-note{font-size:.68rem!important}
.footer-inner p{font-size:.75rem}
.booking-cta-copy p{font-size:1rem}
.booking-action-label{font-size:.62rem}
.peek-chat-form textarea{font-size:.88rem}
@media(max-width:700px){
  .header nav a{font-size:.64rem}
  .header-phone{font-size:.64rem}
  .header-cta,.button{font-size:.66rem}
  .eyebrow,.label{font-size:.65rem}
  .hero-copy>p{font-size:.95rem;line-height:1.68}
  .service p{font-size:.9rem}
  .about p,.process-header p{font-size:.95rem}
  .process-step h3{font-size:.8rem}
  .process-step p{font-size:.88rem}
  main>h2+p{font-size:.95rem}
  .form-field label{font-size:.7rem}
  .footer-inner p{font-size:.75rem}
  .booking-cta-copy p{font-size:.95rem}
}
CSS
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add style.css
          git commit -m "fix: improve site typography readability [typography-patched]"
          git push
