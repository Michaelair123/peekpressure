name: Production checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          files=(
            "worker.js"
            "faq-data.js"
            "functions/api/[[path]].js"
            "functions/api/chat.js"
            "functions/api/faq.js"
            "functions/api/competitive-review.js"
            "scripts/lucy-stress-test.mjs"
          )
          for file in "${files[@]}"; do
            echo "Checking $file"
            cat "$file" | node --input-type=module --check
          done

      - name: Validate JSON configuration
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require("node:fs");
          for (const file of ["_routes.json", "competitive-pricing.json"]) {
            JSON.parse(fs.readFileSync(file, "utf8"));
            console.log("Valid JSON:", file);
          }
          const wrangler = fs.readFileSync("wrangler.jsonc", "utf8")
            .replace(/\/\/.*$/gm, "");
          JSON.parse(wrangler);
          console.log("Valid JSONC:", "wrangler.jsonc");
          NODE

      - name: Check for obvious insecure source patterns
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nI -E '(^|[^[:alnum:]_])eval[[:space:]]*\\(|new[[:space:]]+Function[[:space:]]*\\(|javascript:' -- \
            '*.js' '*.mjs' '*.html' '*.json' '*.jsonc' '*.css' '*.txt' '*.xml'; then
            echo "Potentially unsafe JavaScript pattern found in tracked source files."
            exit 1
          fi

      - name: Check inline JavaScript in index.html
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          if "</script>;" in html:
              raise SystemExit("Malformed script closing sequence found in index.html")
          scripts = []
          for match in re.finditer(r"<script(?:\s[^>]*)?>(.*?)</script>", html, flags=re.S | re.I):
              attrs, script = match.group(0).split(">", 1)[0], match.group(1)
              if re.search(r'type=["\']application/ld\+json["\']', attrs, flags=re.I):
                  continue
              scripts.append(script)
          for i, script in enumerate(scripts, 1):
              Path(f"/tmp/peek-inline-{i}.js").write_text(script, encoding="utf-8")
          print(f"Found {len(scripts)} JavaScript inline script blocks (JSON-LD skipped)")
          PY
          for file in /tmp/peek-inline-*.js; do
            echo "Checking $file"
            cat "$file" | node --input-type=module --check
          done

      - name: Check internal production links
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'https://peekpressure.com/sitemap.xml' robots.txt
          grep -q 'https://peekpressure.com/' sitemap.xml
          grep -q 'https://peekpressure.com/faq.html' sitemap.xml
