name: Competitive Market Pricing Survey

on:
  schedule:
    - cron: "23 15 * * 1"
  workflow_dispatch:
    inputs:
      extra_urls:
        description: "Optional comma-separated competitor URLs"
        required: false
        default: ""

permissions:
  contents: read
  issues: write

jobs:
  survey:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run public competitor survey
        env:
          EXTRA_URLS: \${{ github.event.inputs.extra_urls }}
        run: |
          set -euo pipefail
          if [ -n "\${EXTRA_URLS:-}" ]; then
            python3 - <<'PY'
          import json, os
          from pathlib import Path
          p=Path("competitive-market.json")
          data=json.loads(p.read_text())
          data["additional_urls"]=[u.strip() for u in os.environ["EXTRA_URLS"].split(",") if u.strip()]
          p.write_text(json.dumps(data,indent=2)+"\n")
          PY
          fi
          node scripts/competitive-market-survey.mjs

      - name: Upload survey artifacts
        uses: actions/upload-artifact@v4
        with:
          name: competitive-market-survey
          path: |
            competitive-market-survey.json
            competitive-market-survey.md

      - name: Publish GitHub issue
        env:
          GH_TOKEN: \${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh issue create --title "Bay Area competitive pricing survey — $(date -u +%Y-%m-%d)" --body-file competitive-market-survey.md --label pricing || gh issue create --title "Bay Area competitive pricing survey — $(date -u +%Y-%m-%d)" --body-file competitive-market-survey.md

      - name: Email Monday market survey
        if: \${{ secrets.RESEND_API_KEY != '' }}
        env:
          RESEND_API_KEY: \${{ secrets.RESEND_API_KEY }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import html
          from pathlib import Path
          from datetime import datetime

          report = Path("competitive-market-survey.md").read_text()
          subject_date = datetime.utcnow().strftime("%Y-%m-%d")
          body = html.escape(report)
          email = """<!doctype html>
          <html>
            <body style="margin:0;background:#f5f5f5;font-family:Arial,sans-serif;color:#111;">
              <div style="max-width:820px;margin:24px auto;padding:28px;background:#fff;border:1px solid #e5e5e5;border-radius:14px;">
                <h1 style="margin:0 0 8px;font-size:24px;">PEEK PRESSURE — Weekly Market Survey</h1>
                <p style="margin:0 0 22px;color:#666;">Bay Area competitive pricing and marketplace research · %s</p>
                <pre style="white-space:pre-wrap;font:14px/1.6 Arial,sans-serif;margin:0;">%s</pre>
              </div>
            </body>
          </html>""" % (subject_date, body)
          Path("/tmp/market-survey.html").write_text(email)
          PY

          python3 - <<'PY' > /tmp/resend-payload.json
          import json
          from pathlib import Path
          from datetime import datetime

          report = Path("competitive-market-survey.md").read_text()
          html_body = Path("/tmp/market-survey.html").read_text()
          date = datetime.utcnow().strftime("%Y-%m-%d")
          print(json.dumps({
            "from": "PEEK PRESSURE <look@peekpressure.com>",
            "to": ["look@peekpressure.com"],
            "subject": f"PEEK PRESSURE — Weekly Bay Area Market Survey — {date}",
            "html": html_body,
            "text": report
          }))
          PY

          curl --fail-with-body --silent --show-error https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/resend-payload.json

      - name: Report email configuration
        if: \${{ secrets.RESEND_API_KEY == '' }}
        run: |
          echo "::warning::RESEND_API_KEY is not configured in GitHub Actions, so the Monday market survey was not emailed. The report artifact and GitHub issue were still published."
