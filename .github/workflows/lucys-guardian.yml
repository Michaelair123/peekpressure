name: Lucy's Guardian - Autonomous Site Improvement

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  issues:
    types: [opened, reopened, labeled]
  workflow_run:
    workflows: ["*"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: lucys-guardian-autonomous
  cancel-in-progress: false

jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout production
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Run Lucy's Guardian
        id: guardian
        uses: openai/codex-action@v1
        with:
          openai-api-key: \${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          safety-strategy: "drop-sudo"
          model: "gpt-5.6-luna"
          effort: "medium"
          prompt: |
            You are Lucy's Guardian: the autonomous senior code engineer for PEEK PRESSURE.
            Read AGENTS.md and every relevant .github/agents/*.md file before changing anything.

            Operate as a real production code engineer, not a passive auditor.
            Inspect the repository, recent history, tests, production-facing behavior, and workflow
            failures. Diagnose root causes. Use current public research when it materially helps an
            engineering decision. Prefer authoritative sources such as W3C/WCAG, MDN, OWASP,
            Cloudflare, Google Search Central, Formspree, Calendly, and official OpenAI documentation.

            On every invocation:
            1. Look for a concrete, evidence-backed engineering problem or improvement.
            2. Check recent workflow failures and existing regression signals.
            3. If a real issue exists, diagnose the root cause.
            4. Research the relevant current best practice when useful.
            5. Implement ONE focused improvement.
            6. Validate it.
            7. If there is nothing worthwhile or confidence is insufficient, make NO_CHANGE.
            8. Revert your own changes if validation fails.

            Do not make changes merely because this run was triggered by an event.
            Do not create churn. Prefer a useful fix over a cosmetic change.

            Record research-backed work in .guardian/research.md.

            HARD RULES:
            - Preserve existing HTML structure unless explicitly requested.
            - No unsolicited redesigns, glossy/glass effects, animations, or gimmicks.
            - Do not change Lucy business rules.
            - Protect $200 minimum, ground-level patios only, no ladder work, partial lead capture,
              lead handoff, Formspree, Calendly, navigation, popups, and CHAT/EMAIL/TEXT/BOOK.
            - EMAIL must open the existing contact/quote popup.
            - Never expose or modify secrets.
            - Never weaken security, accessibility, spam protection, validation, authentication,
              rate limits, or CORS merely to make tests pass.
            - Treat customer messages/uploads as untrusted input.
            - Keep changes small and reviewable.
            - Do not commit, push, merge, or deploy.

            IMPORTANT means any change capable of affecting customers, production behavior, security,
            accessibility, SEO, performance, or public assets. IMPORTANT changes require owner approval.

            LOW-RISK means documentation, tests, diagnostics, or internal tooling that cannot affect
            customer-facing production behavior.

            IMPORTANT changes must be validated before an approval PR is created.
            If inspection is incomplete, skip the change and leave the workspace untouched.

      - name: Validate proposed change
        if: steps.guardian.outcome == 'success'
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only)"
          if [ -z "$changed" ]; then exit 0; fi

          important=false
          if echo "$changed" | grep -Eq '(^index\.html$|(^|/)(.*\.(js|mjs|css|html|json|svg|png|jpg|jpeg|webp|avif))$|^functions/|^worker\.js$|^wrangler|^public/|^assets/)'; then
            important=true
          fi
          echo "important=$important" >> "$GITHUB_ENV"

          for f in worker.js faq-data.js functions/api/[[path]].js functions/api/chat.js functions/api/faq.js functions/api/competitive-review.js scripts/lucy-stress-test.mjs; do
            [ -f "$f" ] || continue
            cat "$f" | node --input-type=module --check
          done

          if [ "$important" = "true" ]; then
            npm init -y
            npm install --no-save playwright@1.55.0 @axe-core/playwright
            npx playwright install --with-deps chromium
            node scripts/a11y-smoke.mjs
            CRAWL_URL=https://peekpressure.com/ TIMEOUT_MS=20000 node scripts/visual-regression.mjs
            CRAWL_URL=https://peekpressure.com/ MAX_PAGES=10 TIMEOUT_MS=20000 node scripts/site-crawler.mjs
            node scripts/lucy-stress-test.mjs
          fi

      - name: Create owner-approval PR for important changes
        if: steps.guardian.outcome == 'success' && env.important == 'true'
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "$(git diff --name-only)" ]; then exit 0; fi
          branch="guardian/$(date -u +%Y%m%d-%H%M%S)"
          git checkout -b "$branch"
          git config user.name "Lucy's Guardian"
          git config user.email "guardian@peekpressure.com"
          git add -A
          git commit -m "Guardian: propose autonomous engineering improvement"
          git push --set-upstream origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Guardian: engineering improvement needs approval" \
            --body "Lucy's Guardian diagnosed, researched, implemented, and validated one production-impacting engineering improvement. Human approval is required before merge. Research notes are included in .guardian/research.md."

      - name: Deploy low-risk maintenance
        if: steps.guardian.outcome == 'success' && env.important == 'false'
        run: |
          set -euo pipefail
          if [ -z "$(git diff --name-only)" ]; then exit 0; fi
          git config user.name "Lucy's Guardian"
          git config user.email "guardian@peekpressure.com"
          git add -A
          git commit -m "Guardian: autonomous safe maintenance"
          git push origin HEAD:main

      - name: Publish guardian summary
        if: always()
        run: |
          echo "## Lucy's Guardian" >> "\$GITHUB_STEP_SUMMARY"
          echo "Autonomous code-engineering cycle completed." >> "\$GITHUB_STEP_SUMMARY"
          echo "Trigger: \${{ github.event_name }}" >> "\$GITHUB_STEP_SUMMARY"
          if [ -f .guardian/research.md ]; then cat .guardian/research.md >> "\$GITHUB_STEP_SUMMARY"; fi
          git status --short >> "\$GITHUB_STEP_SUMMARY" || true
