name: Site crawler

on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Maximum same-origin pages to crawl"
        required: false
        default: "25"
  schedule:
    - cron: "17 14 * * 1"

permissions:
  contents: read

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install crawler
        run: |
          npm init -y
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Crawl production site
        env:
          CRAWL_URL: https://peekpressure.com/
          MAX_PAGES: ${{ github.event.inputs.max_pages || '25' }}
          TIMEOUT_MS: "20000"
        run: node scripts/site-crawler.mjs

      - name: Publish crawl report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: peekpressure-site-crawl-report
          path: site-crawl-report.json
          if-no-files-found: warn

      - name: Write crawl summary
        if: always()
        run: |
          echo "## PEEK PRESSURE production crawl" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          node -e "const r=require('./site-crawl-report.json'); console.log(JSON.stringify(r.summary,null,2))" >> "$GITHUB_STEP_SUMMARY"
